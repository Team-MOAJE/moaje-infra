spring:
  application:
    name: moajeGateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-docs
              uri: ${AUTH_SERVICE_URI:http://localhost:8000}
              predicates:
                - Path=/docs/auth/**
              filters:
                - RewritePath=/docs/auth/?(?<segment>.*), /$\{segment}
            - id: asset-docs
              uri: ${ASSET_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/docs/asset/**
              filters:
                - RewritePath=/docs/asset/?(?<segment>.*), /$\{segment}
            - id: banking-docs
              uri: ${BANKING_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/docs/banking/**
              filters:
                - RewritePath=/docs/banking/?(?<segment>.*), /$\{segment}
            - id: auth-module
              uri: ${AUTH_SERVICE_URI:http://localhost:8000}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - RewritePath=/api/v1/auth/?(?<segment>.*), /api/auth/$\{segment}
            - id: asset-module
              uri: ${ASSET_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/assets/**
            - id: banking-module
              uri: ${BANKING_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/v1/banking/**
            - id: work-module
              uri: ${WORK_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/work/**

server:
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    description: Moaje fintech Spring Cloud Gateway
    version: ${APP_VERSION:local}

moaje:
  gateway:
    jwt:
      # Auth의 현재 HS256을 사용할 때는 동일한 SECRET_KEY를 환경변수로 전달한다.
      # RS256으로 전환하면 secret-key 대신 Auth의 JWKS 주소를 사용한다.
      # issuer와 서명 키가 없으면 임시 인증을 허용하지 않고 요청을 차단한다.
      issuer: ${AUTH_JWT_ISSUER:}
      audience: ${AUTH_JWT_AUDIENCE:}
      jwk-set-uri: ${AUTH_JWT_JWK_SET_URI:}
      algorithm: ${AUTH_JWT_ALGORITHM:}
      secret-key: ${AUTH_JWT_SECRET_KEY:}
      public-endpoints: ${AUTH_PUBLIC_ENDPOINTS:POST /api/v1/auth/register,POST /api/v1/auth/login,POST /api/v1/auth/refresh,POST /api/v1/auth/logout,POST /api/v1/auth/token/validate,GET /api/v1/auth/token/validate}
    guard:
      trace-header-name: X-Trace-Id
      internal-headers:
        - X-User-Id
        - X-User-Role
        - X-User-Roles
        - X-Authenticated-User-Id
