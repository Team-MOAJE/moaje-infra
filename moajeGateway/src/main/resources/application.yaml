spring:
  application:
    name: moajeGateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-module
              uri: ${AUTH_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/auth/**
            - id: asset-module
              uri: ${ASSET_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/assets/**
            - id: banking-module
              uri: ${BANKING_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/banking/**
            - id: work-module
              uri: ${WORK_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/work/**

server:
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    description: Moaje fintech Spring Cloud Gateway
    version: ${APP_VERSION:local}

moaje:
  gateway:
    jwt:
      # 회의 후 .env에 네 값을 입력한다. issuer는 Auth의 iss, audience는 앱 API용 aud와 정확히 같아야 한다.
      # jwk-set-uri는 공개키 목록 URL이며 비밀키가 아니다. algorithm에는 합의한 RS256 등의 값을 넣는다.
      # 빈 값은 임시 인증 허용이 아니라 요청 차단이다. 실제 JWT나 개인정보는 이 파일에 적지 않는다.
      issuer: ${AUTH_JWT_ISSUER:}
      audience: ${AUTH_JWT_AUDIENCE:}
      jwk-set-uri: ${AUTH_JWT_JWK_SET_URI:}
      algorithm: ${AUTH_JWT_ALGORITHM:}
      public-endpoints: ${AUTH_PUBLIC_ENDPOINTS:}
    guard:
      trace-header-name: X-Trace-Id
      internal-headers:
        - X-User-Id
        - X-User-Role
        - X-User-Roles
        - X-Authenticated-User-Id
