<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MOAJE Test Fixture Console</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #20242a; background: #f3f5f7; font: 14px/1.5 Arial, sans-serif; }
        header { padding: 18px 24px; color: #fff; background: #243142; }
        h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
        main { max-width: 1040px; margin: 0 auto; padding: 24px; }
        .toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) 160px auto; gap: 12px; align-items: end; }
        label { display: grid; gap: 6px; font-weight: 700; }
        select, input, button { height: 40px; border: 1px solid #b8c0ca; border-radius: 4px; padding: 0 12px; font: inherit; }
        button { border-color: #087f5b; color: #fff; background: #087f5b; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        #status { min-height: 24px; margin: 20px 0 10px; font-weight: 700; }
        .result { display: none; overflow: hidden; border: 1px solid #d1d6dc; border-radius: 6px; background: #fff; }
        .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid #d1d6dc; }
        .summary div { padding: 14px; border-right: 1px solid #e4e7eb; }
        .summary div:last-child { border-right: 0; }
        .summary strong, .summary span { display: block; overflow-wrap: anywhere; }
        h2 { margin: 0; padding: 14px 12px 8px; font-size: 15px; letter-spacing: 0; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e4e7eb; text-align: right; }
        th:first-child, td:first-child { text-align: left; }
        th { background: #f7f8fa; }
        @media (max-width: 720px) {
            .toolbar, .summary { grid-template-columns: 1fr; }
            .summary div { border-right: 0; border-bottom: 1px solid #e4e7eb; }
        }
    </style>
</head>
<body>
<header><h1>MOAJE Test Fixture Console</h1></header>
<main>
    <form id="fixture-form" class="toolbar">
        <label>페르소나
            <select id="persona">
                <option value="BALANCED_STUDENT">균형 소비 대학생</option>
                <option value="CAFE_AND_DINING">카페·외식 중심</option>
                <option value="COMMUTER">통학·교통 중심</option>
                <option value="STUDY_FOCUSED">학습 중심</option>
            </select>
        </label>
        <label>생성 기간
            <select id="months">
                <option value="1">최근 1개월</option>
                <option value="3" selected>최근 3개월</option>
                <option value="6">최근 6개월</option>
            </select>
        </label>
        <button id="submit" type="submit">데이터 생성</button>
    </form>
    <div id="status"></div>
    <section id="result" class="result">
        <div id="summary" class="summary"></div>
        <h2>월별 현금 흐름</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>월</th><th>수입</th><th>지출</th><th>자금이동</th><th>Revision</th></tr></thead>
                <tbody id="monthly"></tbody>
            </table>
        </div>
        <h2>카테고리별 지출</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>월</th><th>카테고리</th><th>금액</th></tr></thead>
                <tbody id="categories"></tbody>
            </table>
        </div>
    </section>
</main>
<script>
    const form = document.getElementById('fixture-form');
    const submit = document.getElementById('submit');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const summary = document.getElementById('summary');
    const monthly = document.getElementById('monthly');
    const categories = document.getElementById('categories');

    const money = value => Number(value).toLocaleString('ko-KR') + '원';

    form.addEventListener('submit', async event => {
        event.preventDefault();
        submit.disabled = true;
        status.textContent = '생성 중...';
        result.style.display = 'none';
        try {
            const response = await fetch('/api/personas', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({persona: persona.value, months: Number(months.value)})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || '생성에 실패했습니다.');
            summary.innerHTML = `
                <div><span>사용자</span><strong>${data.email}</strong></div>
                <div><span>PIN</span><strong>${data.pin}</strong></div>
                <div><span>Account ID</span><strong>${data.accountId}</strong></div>
                <div><span>생성 거래</span><strong>${data.createdTransactionCount}건</strong></div>`;
            monthly.innerHTML = data.aggregates.map(item => `
                <tr><td>${item.yearMonth}</td><td>${money(item.monthly.incomeAmount)}</td>
                <td>${money(item.monthly.expenseAmount)}</td><td>${money(item.monthly.transferAmount)}</td>
                <td>${item.monthly.revision}</td></tr>`).join('');
            categories.innerHTML = data.aggregates.flatMap(item => item.categories
                .filter(category => Number(category.amount) > 0)
                .map(category => `<tr><td>${item.yearMonth}</td><td>${category.category}</td><td>${money(category.amount)}</td></tr>`)
            ).join('');
            status.textContent = '생성 완료';
            result.style.display = 'block';
        } catch (error) {
            status.textContent = error.message;
        } finally {
            submit.disabled = false;
        }
    });
</script>
</body>
</html>
