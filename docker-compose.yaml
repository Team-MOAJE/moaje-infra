services:
  auth-mysql:
    image: mysql:8.4
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-auth-mysql
    mem_limit: 768m
    ports:
      - "127.0.0.1:${AUTH_MYSQL_PORT:-3309}:3306"
    environment:
      MYSQL_DATABASE: moaje_auth
      MYSQL_ROOT_PASSWORD: moaje-auth-root
      MYSQL_USER: moaje_auth
      MYSQL_PASSWORD: moaje_auth
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    volumes:
      - auth-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: "no"

  asset-mysql:
    image: mysql:8.4
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-asset-mysql
    mem_limit: 768m
    ports:
      - "127.0.0.1:${ASSET_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: moaje_asset
      MYSQL_ROOT_PASSWORD: moaje-asset-root
      MYSQL_USER: moaje_asset
      MYSQL_PASSWORD: moaje_asset
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    volumes:
      - asset-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: "no"

  banking-mysql:
    image: mysql:8.4
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-banking-mysql
    mem_limit: 768m
    ports:
      - "127.0.0.1:${BANKING_MYSQL_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: moaje_banking
      MYSQL_ROOT_PASSWORD: moaje-banking-root
      MYSQL_USER: moaje_banking
      MYSQL_PASSWORD: moaje_banking
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    volumes:
      - banking-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: "no"

  redis:
    image: redis:7.4-alpine
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-redis
    mem_limit: 256m
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    # 공용 Redis는 캐시·세션 등에 사용한다. Mock 원장은 별도 Redis에 있다. 용량 초과를 조용한 삭제로 숨기지 않는다.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  redisinsight:
    profiles: ["tools"]
    image: redis/redisinsight:2.70
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-redisinsight
    mem_limit: 512m
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-kafka
    mem_limit: 1g
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s
    restart: "no"

  kafka-ui:
    profiles: ["tools"]
    image: provectuslabs/kafka-ui:latest
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-kafka-ui
    mem_limit: 512m
    ports:
      - "127.0.0.1:8989:8080"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx256m"
      KAFKA_CLUSTERS_0_NAME: moaje-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: "no"

  mock-redis:
    profiles: ["apps"]
    image: redis:7.4-alpine
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-mock-redis
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - mock-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  auth:
    profiles: ["apps"]
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-auth
    mem_limit: 512m
    build:
      context: ../moaje-auth
      dockerfile: Dockerfile
    command: ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: mysql+asyncmy://moaje_auth:moaje_auth@auth-mysql:3306/moaje_auth?charset=utf8mb4
      APP_ENV: local
      SECRET_KEY: ${AUTH_JWT_SECRET_KEY:-}
      ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${AUTH_JWT_ISSUER:-moaje-auth}
      JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-}
      AES_MASTER_KEY: ${AUTH_AES_MASTER_KEY:-}
      GRPC_PORT: 50051
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      auth-mysql:
        condition: service_healthy
    restart: "no"

  mock-banking:
    profiles: ["apps"]
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-mock-banking
    mem_limit: 512m
    build:
      context: ../backing-mockup
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${MOCK_BANKING_PORT:-8081}:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: mock-redis
      REDIS_PORT: 6379
      MOAJE_BANKING_SECRET: ${MOAJE_BANKING_HMAC_SECRET:-Moaje-banking-secret}
      MOAJE_FIXTURE_ENABLED: "true"
      MOAJE_FIXTURE_ADMIN_TOKEN: ${MOAJE_FIXTURE_ADMIN_TOKEN:-moaje-local-fixture-token}
    depends_on:
      mock-redis:
        condition: service_healthy
    restart: "no"

  test-fixture-console:
    profiles: ["test-tools"]
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-test-fixture-console
    mem_limit: 128m
    build:
      context: ./test-fixture-console
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${TEST_FIXTURE_CONSOLE_PORT:-8090}:8090"
    environment:
      GATEWAY_URL: http://gateway:8080
      MOCK_BANKING_URL: http://mock-banking:8081
      FIXTURE_ADMIN_TOKEN: ${MOAJE_FIXTURE_ADMIN_TOKEN:-moaje-local-fixture-token}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      gateway:
        condition: service_started
      mock-banking:
        condition: service_started
    restart: "no"

  asset:
    profiles: ["apps"]
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-asset
    mem_limit: 768m
    build:
      context: ..
      dockerfile: moaje-asset/Dockerfile
    # 내부 사용자 헤더는 Gateway만 만들어야 한다. 외부에서 서비스 HTTP로 직접 들어오는 포트를 열지 않는다.
    volumes:
      - ${MOAJE_GRPC_CERTS_DIR:-./certs}/asset:/run/grpc:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
      SPRING_DATASOURCE_URL: jdbc:mysql://asset-mysql:3306/moaje_asset?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: moaje_asset
      SPRING_DATASOURCE_PASSWORD: moaje_asset
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # 기존 DB를 V1이라고 추측하지 않는다. 신규 DB에는 V1부터 적용하고, 구 DB 전환은 명시적으로 검토한다.
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MOAJE_ID_TSID_NODE: 1
      MOAJE_ASSET_GRPC_SERVER_PORT: 9090
      MOAJE_ASSET_BANKING_GRPC_HOST: banking
      ASSET_PROJECTION_SYNC_ENABLED: "true"
      ASSET_PROJECTION_AUDIT_INTERVAL_MS: ${ASSET_PROJECTION_AUDIT_INTERVAL_MS:-30000}
      ASSET_GRPC_TLS_CERTIFICATE_CHAIN_PATH: /run/grpc/asset.crt
      ASSET_GRPC_TLS_PRIVATE_KEY_PATH: /run/grpc/asset.key
      ASSET_GRPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/grpc/ca.crt
      ASSET_GRPC_CLIENT_CERTIFICATE_CHAIN_PATH: /run/grpc/asset.crt
      ASSET_GRPC_CLIENT_PRIVATE_KEY_PATH: /run/grpc/asset.key
      BANKING_GRPC_SERVER_TRUST_CERTIFICATE_COLLECTION_PATH: /run/grpc/ca.crt
    depends_on:
      asset-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      grpc-cert-init:
        condition: service_completed_successfully
    restart: "no"

  banking:
    profiles: ["apps"]
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-banking
    mem_limit: 768m
    build:
      context: ..
      dockerfile: moaje-banking/Dockerfile
    volumes:
      - ${MOAJE_GRPC_CERTS_DIR:-./certs}/banking:/run/grpc:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
      SPRING_DATASOURCE_URL: jdbc:mysql://banking-mysql:3306/moaje_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: moaje_banking
      SPRING_DATASOURCE_PASSWORD: moaje_banking
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MOAJE_ID_TSID_NODE: 2
      MOAJE_BANKING_GRPC_SERVER_PORT: 9091
      BANKING_GRPC_TLS_CERTIFICATE_CHAIN_PATH: /run/grpc/banking.crt
      BANKING_GRPC_TLS_PRIVATE_KEY_PATH: /run/grpc/banking.key
      BANKING_GRPC_TLS_TRUST_CERTIFICATE_COLLECTION_PATH: /run/grpc/ca.crt
      MOAJE_BANKING_EXTERNAL_API_BASE_URL: ${MOAJE_MOCK_BASE_URL:-http://mock-banking:8081/}
    depends_on:
      banking-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      grpc-cert-init:
        condition: service_completed_successfully
      mock-banking:
        condition: service_started
    restart: "no"

  gateway:
    profiles: ["apps"]
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-gateway
    mem_limit: 512m
    build:
      context: ./moajeGateway
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-}
      AUTH_JWT_JWK_SET_URI: ${AUTH_JWT_JWK_SET_URI:-}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:-}
      AUTH_PUBLIC_ENDPOINTS: ${AUTH_PUBLIC_ENDPOINTS:-POST /api/v1/auth/register,POST /api/v1/auth/login,POST /api/v1/auth/refresh,POST /api/v1/auth/logout,POST /api/v1/auth/token/validate,GET /api/v1/auth/token/validate}
      AUTH_SERVICE_URI: ${AUTH_SERVICE_URI:-http://auth:8000}
      ASSET_SERVICE_URI: http://asset:8082
      BANKING_SERVICE_URI: http://banking:8080
      WORK_SERVICE_URI: http://host.docker.internal:8084
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth:
        condition: service_healthy
      asset:
        condition: service_started
      banking:
        condition: service_started
    restart: "no"

  grpc-cert-init:
    profiles: ["apps"]
    image: alpine/openssl:latest
    mem_limit: 64m
    entrypoint: ["/bin/sh", "/scripts/init-certs.sh"]
    volumes:
      - ${MOAJE_GRPC_CERTS_DIR:-./certs}:/certs
      - ./grpc/init-certs.sh:/scripts/init-certs.sh:ro
    restart: "no"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-prometheus
    mem_limit: 512m
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: "no"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:latest
    container_name: ${MOAJE_STACK_PREFIX:-moaje}-grafana
    mem_limit: 384m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: "no"

volumes:
  auth-mysql-data:
  asset-mysql-data:
  banking-mysql-data:
  redis-data:
  mock-redis-data:
  redisinsight-data:
  kafka-data:
  prometheus-data:
  grafana-data:
