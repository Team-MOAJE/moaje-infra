version: '3.8'

services:
  # 1. Redis: 금융사 상태값 캐시 및 세션 관리
  redis:
    image: redis:latest
    container_name: moaje-redis
    platform: linux/amd64  # Mac(Apple Silicon) 호환성을 위해 추가
    ports:
      - "6379:6379"
    restart: always

  # 2. Kafka: 비동기 메시지 큐 (KRaft 모드)
  kafka:
    image: bitnami/kafka:latest
    container_name: moaje-kafka
    platform: linux/amd64  # Mac(Apple Silicon) 호환성을 위해 추가
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT # dev는 PLANTEXT이나, 실 서비스는 SSL로 해야함.
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    restart: always

  # 3. Kafka UI: 메시지 모니터링 도구 (포트 8989)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: moaje-kafka-ui
    platform: linux/amd64  # Mac(Apple Silicon) 호환성을 위해 추가
    ports:
      - "8989:8080"  # [내 컴퓨터 포트]:[컨테이너 내부 포트] -> 8989로 접속
    environment:
      - KAFKA_CLUSTERS_0_NAME=moaje-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka