services:
  redis:
    image: redis:7.4-alpine
    container_name: moaje-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: always

  kafka:
    image: bitnami/kafka:latest
    container_name: moaje-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
    volumes:
      - kafka-data:/bitnami/kafka
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: moaje-kafka-ui
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: moaje-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: always

  nginx-cert-init:
    image: alpine/openssl:latest
    container_name: moaje-nginx-cert-init
    command: >
      sh -c 'if [ ! -f /certs/local.crt ] || [ ! -f /certs/local.key ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /certs/local.key
        -out /certs/local.crt
        -subj "/C=KR/ST=Seoul/L=Seoul/O=Moaje/OU=Local/CN=localhost"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1";
      fi'
    volumes:
      - nginx-certs:/certs
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: moaje-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nginx-cert-init:
        condition: service_completed_successfully
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: moaje-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    container_name: moaje-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: always

volumes:
  redis-data:
  kafka-data:
  nginx-certs:
  prometheus-data:
  grafana-data:
