services:
  asset-mysql:
    image: mysql:8.4
    container_name: moaje-asset-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: moaje_asset
      MYSQL_ROOT_PASSWORD: moaje-asset-root
      MYSQL_USER: moaje_asset
      MYSQL_PASSWORD: moaje_asset
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - asset-mysql-data:/var/lib/mysql
    restart: always

  banking-mysql:
    image: mysql:8.4
    container_name: moaje-banking-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: moaje_banking
      MYSQL_ROOT_PASSWORD: moaje-banking-root
      MYSQL_USER: moaje_banking
      MYSQL_PASSWORD: moaje_banking
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - banking-mysql-data:/var/lib/mysql
    restart: always

  redis:
    image: redis:7.4-alpine
    container_name: moaje-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: always

  redisinsight:
    image: redis/redisinsight:2.70
    container_name: moaje-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: moaje-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: moaje-kafka-ui
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: moaje-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: always

  asset:
    container_name: moaje-asset
    build:
      context: ..
      dockerfile: moaje-asset/Dockerfile
    ports:
      - "8082:8082"
      - "19090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://asset-mysql:3306/moaje_asset?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: moaje_asset
      SPRING_DATASOURCE_PASSWORD: moaje_asset
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MOAJE_ID_TSID_NODE: 1
      MOAJE_ASSET_GRPC_SERVER_PORT: 9090
    depends_on:
      - asset-mysql
      - redis
      - kafka
    restart: always

  banking:
    container_name: moaje-banking
    build:
      context: ..
      dockerfile: moaje-banking/Dockerfile
    ports:
      - "8083:8080"
      - "19091:9091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://banking-mysql:3306/moaje_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: moaje_banking
      SPRING_DATASOURCE_PASSWORD: moaje_banking
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MOAJE_ID_TSID_NODE: 2
      MOAJE_BANKING_GRPC_SERVER_PORT: 9091
      MOAJE_BANKING_ASSET_GRPC_HOST: asset
      MOAJE_BANKING_ASSET_GRPC_PORT: 9090
      MOAJE_BANKING_EXTERNAL_API_BASE_URL: http://host.docker.internal:8081/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - banking-mysql
      - redis
      - kafka
      - asset
    restart: always

  gateway:
    container_name: moaje-gateway
    build:
      context: ./moajeGateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URI: http://host.docker.internal:8085
      ASSET_SERVICE_URI: http://asset:8082
      BANKING_SERVICE_URI: http://banking:8080
      WORK_SERVICE_URI: http://host.docker.internal:8084
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - asset
      - banking
    restart: always

  nginx-cert-init:
    image: alpine/openssl:latest
    container_name: moaje-nginx-cert-init
    entrypoint: ["/bin/sh", "/scripts/init-certs.sh"]
    volumes:
      - nginx-certs:/certs
      - ./nginx/init-certs.sh:/scripts/init-certs.sh:ro
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: moaje-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nginx-cert-init:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: moaje-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - gateway
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    container_name: moaje-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: always

volumes:
  asset-mysql-data:
  banking-mysql-data:
  redis-data:
  redisinsight-data:
  kafka-data:
  nginx-certs:
  prometheus-data:
  grafana-data:
