# 개발 스택과 이름·포트·볼륨을 분리한다. 반드시 별도 -p moaje-e2e-* 이름으로 사용한다.
services:
  auth-mysql:
    ports: !reset []
  asset-mysql:
    ports: !reset []
  banking-mysql:
    ports: !reset []
  redis:
    ports: !reset []
  kafka:
    ports: !reset []
  mock-banking:
    image: moaje-infra-mock-banking:latest
    ports: !reset []
  gateway:
    image: moaje-infra-gateway:latest
    ports: !override
      - "127.0.0.1:19080:8080"
  banking:
    image: moaje-infra-banking:latest
    environment:
      MOAJE_BANKING_RECONCILIATION_TRANSFER_ENABLED: "true"
      MOAJE_BANKING_RECONCILIATION_TRANSFER_FIXED_DELAY_MS: "5000"
      MOAJE_BANKING_EXTERNAL_API_BASE_URL: http://fault-proxy:18081/
    depends_on:
      fault-proxy:
        condition: service_started
  fault-proxy:
    profiles: ["apps"]
    image: python:3.12-slim
    command: ["python", "/tests/e2e-proxy.py"]
    volumes:
      - ./tests/e2e-proxy.py:/tests/e2e-proxy.py:ro
    restart: "no"
  work:
    image: moaje-infra-work:latest
    environment:
      WORK_INTERNAL_TOKEN: e2e-local-operator-only
  asset:
    image: moaje-infra-asset:latest
    environment:
      # 달력이 바뀔 때까지 기다리지 않고 전월 재집계 경로를 실제로 실행한다.
      MOAJE_ASSET_CASHFLOW_REVISION_CRON: "*/15 * * * * *"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics
  auth:
    image: moaje-infra-auth:latest
